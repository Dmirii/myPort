  <!-- Schema.org Book & BreadcrumbList (English) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Book",
        "@id": "https://dimaa.ru/en/{{filename}}#book",
        "name": "{{title}}",
        "headline": "{{title}}",
        "alternativeHeadline": "{{subtitle}}",
        "description": "{{seo.description}}",
        "image": "{{seo.ogImage}}",
        "inLanguage": "ru",
        "bookFormat": "EBook",
        "author": {
          "@type": "Person",
          "name": "Dmitry Antonov",
          "jobTitle": "Systems Methodologist & Author",
          "url": "https://dimaa.ru/en/",
          "sameAs": [
            "https://vk.com/dimaa_ru",
            "https://www.instagram.com/dimaa.ru",
            "https://www.linkedin.com/in/dimaa-ru/",
            "https://github.com/Dmirii"
          ]
        },
        "isPartOf": {
          "@type": "BookSeries",
          "name": "Engineering Model of Reality",
          "url": "https://dimaa.ru/en/#books"
        },
        "publisher": {
          "@type": "Organization",
          "name": "Litres Self-Publishing"
        }{{#if litresLink}},
        "offers": {
          "@type": "Offer",
          "url": "{{litresLink}}",
          "availability": "https://schema.org/InStock",
          "priceCurrency": "RUB",
          "seller": {
            "@type": "Organization",
            "name": "Litres",
            "url": "https://www.litres.ru"
          }
        }{{/if}}
      },
      {
        "@type": "BreadcrumbList",
        "itemListElement": [
          {
            "@type": "ListItem",
            "position": 1,
            "name": "Home",
            "item": "https://dimaa.ru/en/"
          },
          {
            "@type": "ListItem",
            "position": 2,
            "name": "Books",
            "item": "https://dimaa.ru/en/#books"
          },
          {
            "@type": "ListItem",
            "position": 3,
            "name": "{{title}}",
            "item": "https://dimaa.ru/en/{{filename}}"
          }
        ]
      }
    ]
  }
  </script>
  
  <style>
    .container { max-width: 860px; margin: 0 auto; padding: 0 1.2rem; }
    /* Book styles */
    .book-header {
      display: flex;
      gap: 1.8rem;
      align-items: flex-start;
      margin: 1.5rem 0 2rem;
    }
    .book-cover-small { flex-shrink: 0; width: 160px; }
    .book-cover-small img { width: 100%; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); display: block; }
    .book-info { flex: 1; }
    .book-info .book-number { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 1.5px; color: #685f52; margin-bottom: 0.2rem; }
    .book-info .book-status-badge { display: inline-block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; background: #f1efe9; color: #8a7f6d; padding: 0.1rem 0.6rem; border-radius: 20px; font-weight: 600; margin-bottom: 0.3rem; }
    .book-info .book-status-badge.available { background: #eef4ed; color: #2c6e49; }
    .book-info .book-status-badge.planned { background: #f1efe9; color: #8a7f6d; }
    .book-info .book-status-badge.in-progress { background: #e8f0fe; color: #1a5a8a; }
    .book-info h1 { font-size: 1.5rem; font-weight: 700; color: #1e3a2f; margin: 0 0 0.2rem 0; line-height: 1.2; }
    .book-info .book-subtitle { font-size: 0.9rem; color: #2c6e49; font-weight: 500; margin-bottom: 0.5rem; }
    .book-info .book-meta-line { font-size: 0.8rem; color: #5f6c66; margin-bottom: 0.8rem; }
    .book-info .book-meta-line span { background: #eef4ed; padding: 0.1rem 0.6rem; border-radius: 20px; font-size: 0.7rem; }
    .book-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 0.2rem; }
    .book-actions .btn { font-size: 0.8rem; padding: 0.4rem 1rem; border-radius: 40px; text-decoration: none; font-weight: 500; }
    .btn { display: inline-block; background: #1e3a2f; color: white; padding: 0.7rem 1.5rem; border-radius: 40px; text-decoration: none; font-weight: 500; border: none; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background: #0f2c22; }
    .btn-litres { background: #b87c4f; }
    .btn-litres:hover { background: #a06a3f; }
    h2 { font-size: 1.2rem; margin: 1.5rem 0 0.6rem; border-left: 3px solid #2c6e49; padding-left: 0.8rem; color: #1e3a2f; }
    .book-content p { font-size: 0.92rem; line-height: 1.6; color: #2d3e3b; margin-bottom: 0.6rem; }
    .book-content ul { margin: 0.3rem 0 0.8rem 1.2rem; padding: 0; list-style: none; }
    .book-content ul li { font-size: 0.88rem; line-height: 1.5; color: #2d3e3b; padding: 0.15rem 0 0.15rem 1.2rem; position: relative; }
    .book-content ul li::before { content: "—"; position: absolute; left: 0; color: #b87c4f; }
    .info-block { background: #f7f4ef; padding: 0.8rem 1.2rem; border-radius: 16px; margin: 1rem 0; font-size: 0.9rem; border-left: 3px solid #b87c4f; }
    .info-block p { margin: 0; color: #3d4d47; }
    footer { text-align: center; padding: 1.5rem 1rem; font-size: 0.75rem; color: #5f6c66; background: #f1efe9; margin-top: 1rem; }
    .footer-quote { font-style: italic; font-size: 0.7rem; margin-top: 0.3rem; color: #8a7f6d; }
    @media (max-width: 640px) {
      .book-header { flex-direction: column; align-items: center; text-align: center; gap: 0.8rem; margin: 1rem 0 1.5rem; }
      .book-cover-small { width: 140px; }
      .book-info h1 { font-size: 1.3rem; }
      .book-actions { justify-content: center; }
    }
  </style>
</head>
