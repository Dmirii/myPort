<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Сообщить о выходе книги — Дмитрий Антонов</title>
  <meta name="description" content="Оставьте email, чтобы получить уведомление о выходе новой книги Дмитрия Антонова.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://dimaa.ru/feedback.html">
  <meta property="og:title" content="Сообщить о выходе книги — Дмитрий Антонов">
  <meta property="og:description" content="Оставьте email для уведомления о новой книге.">
  <meta property="og:image" content="https://dimaa.ru/img/logo.jpeg">
  <link rel="icon" type="image/jpeg" href="/img/logo.jpeg">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #faf9f8;
      font-family: system-ui, -apple-system, 'Segoe UI', 'Roboto', sans-serif;
      line-height: 1.5;
      color: #1e1e2a;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      color: #1e3a2f;
    }

    .navbar {
      padding: 1rem 0;
      background: #ffffff;
      border-bottom: 1px solid #e2e2e6;
      position: sticky;
      top: 0;
      background: rgba(255,255,255,0.94);
      z-index: 10;
    }

    .nav-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.8rem;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    .logo {
      font-weight: 700;
      font-size: 1rem;
      text-decoration: none;
      color: #1e3a2f;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo img {
      width: 32px;
      height: 32px;
      border-radius: 8px;
    }

    .nav-links {
      display: flex;
      gap: 1.2rem;
    }

    .nav-links a {
      text-decoration: none;
      font-weight: 500;
      color: #2d3e3b;
      font-size: 0.85rem;
    }

    .feedback-header {
      text-align: center;
      margin: 2rem 0 1rem;
    }

    .form-wrapper {
      background: #ffffff;
      border-radius: 32px;
      border: 1px solid #e2ddd4;
      overflow: hidden;
      margin: 1rem 0 1.5rem;
    }

    .form-wrapper iframe {
      display: block;
      width: 100%;
      height: 560px;
      border: none;
    }

    .btn-back {
      display: inline-block;
      background: #1e3a2f;
      color: white;
      padding: 0.7rem 1.5rem;
      border-radius: 40px;
      text-decoration: none;
      font-weight: 500;
      margin: 0.5rem 0 2rem;
    }

    .auto-redirect-note {
      font-size: 0.8rem;
      color: #5f6c66;
      text-align: center;
      margin-top: 0.5rem;
    }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      font-size: 0.75rem;
      color: #5f6c66;
      background: #f1efe9;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo">
        <img src="/img/logo.jpeg" alt="Логотип">
        <span>РУНЫ КАК ЭТАПЫ ПРОЦЕССА</span>
      </a>
      <div class="nav-links">
        <a href="index.html#about">Об авторе</a>
        <a href="index.html#books">Книги</a>
        <a href="index.html#contacts">Контакты</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="feedback-header">
      <h1>📬 Сообщить о выходе книги</h1>
    </div>

    <div class="form-wrapper">
      <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSf9T3QSUZuKLSIYMuDjdfM26ZsGzNDrB0G8lsClKeTNyRr9cA/viewform?embedded=true" 
              frameborder="0">
        Загрузка…
      </iframe>
    </div>

    <div style="text-align: center;">
      <a href="index.html#books" class="btn-back">← Вернуться к книгам</a>
    </div>
    <div class="auto-redirect-note">
      ✨ Если вы ничего не нажмёте — через 30 секунд вернётесь автоматически.
    </div>
  </main>

  <footer>
    <div class="container">
      <p>© Дмитрий Антонов · Руны как этапы процесса</p>
    </div>
  </footer>

  <script>
    // Автоматический редирект на главную страницу через 10 секунд
    setTimeout(function() {
      window.location.href = "index.html#books";
    }, 30000);
  </script>
</body>
</html>
