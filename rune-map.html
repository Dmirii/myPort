<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Карта рун · Инженерная модель реальности</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0f0c0a;
            font-family: system-ui, -apple-system, 'Segoe UI', 'Roboto', sans-serif;
            color: #e2dcd5;
            padding: 16px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #2a201b;
        }

        .rune-title {
            font-size: 2rem;
            letter-spacing: 6px;
            color: #e0b185;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 500;
            color: #eedbcb;
        }

        .sub {
            font-size: 0.75rem;
            color: #b68b65;
            text-transform: uppercase;
            margin-top: 6px;
        }

        .book-note {
            background: #1a1512;
            padding: 10px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin: 16px 0;
            border-left: 3px solid #b87c4f;
            color: #ccb79e;
        }

        .rune-card {
            background: #161210;
            border-radius: 24px;
            margin-bottom: 16px;
            padding: 16px;
            border: 1px solid #2a201b;
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .rune-img {
            flex-shrink: 0;
            width: 70px;
            height: 70px;
            background: #0f0d0b;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #3e2c22;
        }

        .rune-img img {
            max-width: 55px;
            max-height: 55px;
        }

        .rune-info {
            flex: 1;
        }

        .rune-name {
            font-size: 1.35rem;
            font-weight: 600;
            color: #e7ba8e;
            letter-spacing: 1px;
        }

        .rune-energy {
            font-size: 0.7rem;
            color: #b87c4f;
            text-transform: uppercase;
            margin: 4px 0 6px;
        }

        .where {
            font-size: 0.85rem;
            color: #c2b09b;
            margin-bottom: 6px;
        }

        .where span {
            color: #e0b185;
            font-weight: 500;
        }

        .what {
            font-size: 0.85rem;
            color: #ccb79e;
            border-left: 2px solid #5e3a25;
            padding-left: 10px;
            margin-top: 6px;
        }

        .rune-num {
            font-size: 0.7rem;
            color: #6b4f38;
            margin-top: 6px;
            text-align: right;
        }

        .filter-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 8px 0 16px;
            margin-bottom: 8px;
            -webkit-overflow-scrolling: touch;
        }

        .filter-btn {
            background: #1f1916;
            border: none;
            padding: 6px 14px;
            border-radius: 40px;
            color: #ccb79e;
            font-size: 0.75rem;
            white-space: nowrap;
            cursor: pointer;
        }

        .filter-btn.active {
            background: #5e3a25;
            color: #f2e0d2;
            border: 1px solid #c69062;
        }

        .footer {
            text-align: center;
            font-size: 0.7rem;
            color: #6b4f38;
            margin: 32px 0 20px;
            padding-top: 16px;
            border-top: 1px solid #2a201b;
        }

        @media (max-width: 500px) {
            .rune-card {
                flex-direction: column;
                text-align: center;
            }
            .rune-img {
                width: 80px;
                height: 80px;
            }
            .what {
                text-align: left;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="rune-title">ᚱ ᚢ ᚾ ᛖ</div>
        <h1>Карта рун</h1>
        <div class="sub">24 этапа · Инженерная модель реальности</div>
        <div class="book-note">
            📖 Руна — не «магия», а этап процесса. Феху — не деньги, а начало.<br>
            Хагалаз — не разрушение, а жизнь с результатом.
        </div>
    </div>

    <div class="filter-bar">
        <button class="filter-btn active" data-group="all">Все руны</button>
        <button class="filter-btn" data-group="1">1–4 Зарождение</button>
        <button class="filter-btn" data-group="2">5–8 Движение</button>
        <button class="filter-btn" data-group="3">9–12 Трансформация</button>
        <button class="filter-btn" data-group="4">13–16 Перерождение</button>
        <button class="filter-btn" data-group="5">17–20 Завершение</button>
        <button class="filter-btn" data-group="6">21–24 Итог</button>
    </div>

    <div id="runeList"></div>

    <div class="footer">
        ᚦ По книге «Инженерная модель реальности» · этапы, а не заклинания<br>
        Порядок рун — классический Футарк (1–24)
    </div>
</div>

<script>
    const runes = [
        { id: 1, name: "ᚠ Феху", energy: "Начало, искра, зарождение идеи", where: "Мысль появилась из ниоткуда. То, чего не было минуту назад — теперь есть.", what: "Зафиксируй мысль. Не действуй сразу. Дай ей пройти Уруз и Турисаз.", group: 1 },
        { id: 2, name: "ᚢ Уруз", energy: "Многообразие, вихрь, хаос вариантов", where: "В голове каша. 100 вариантов. Глаза разбегаются.", what: "Не принимай решение. Собирай данные. Крутись в вихре.", group: 1 },
        { id: 3, name: "ᚦ Турисаз", energy: "Выбор, отсечение лишнего, острие", where: "Ты говоришь 'да' одному и 'нет' остальным.", what: "Сделай выбор. Без него ты застрянешь в Уруз навсегда.", group: 1 },
        { id: 4, name: "ᚨ Ансуз", energy: "Подтверждение, одобрение, зелёный свет", where: "Ты получил знак — внутренний или внешний — что выбор верен.", what: "Закрепи решение. Скажи вслух: 'Да, я выбрал это'.", group: 1 },
        { id: 5, name: "ᚱ Райдо", energy: "Первый шаг, рывок, старт", where: "Страх первого шага позади. Ты начал.", what: "Делай самое маленькое движение. Не жди идеального момента.", group: 2 },
        { id: 6, name: "ᚲ Кеназ", energy: "Проявление, материализация, свет", where: "Идея стала видимой для мира. Её можно потрогать.", what: "Покажи результат. Выведи из тени.", group: 2 },
        { id: 7, name: "ᚷ Гебо", energy: "Гармония, баланс, равновесие", where: "Новое и старое договорились. Никто не уничтожен.", what: "Сохрани связи со старым миром. Не сжигай мосты.", group: 2 },
        { id: 8, name: "ᚹ Вуньо", energy: "Радость, завершение этапа, выдох", where: "Ты сделал. Короткое счастье.", what: "Порадуйся. Но не застревай — дальше Хагалаз.", group: 2 },
        { id: 9, name: "ᚺ Хагалаз", energy: "Жизнь с результатом, рутина, проверка", where: "Эйфория прошла. Начались будни. Машина пачкается и требует бензина.", what: "Не паникуй. Это норма. Хагалаз — зеркало качества твоего творения.", group: 3 },
        { id: 10, name: "ᚾ Наутиз", energy: "Нужда, дискомфорт, сигнал к переменам", where: "Что-то жмёт, трет, беспокоит. Ещё не катастрофа, но уже не то.", what: "Услышь сигнал. Не игнорируй маленькую боль.", group: 3 },
        { id: 11, name: "ᛁ Иса", energy: "Пауза, заморозка, концентрация", where: "Ты остановился. Думаешь. Не бежишь.", what: "Возьми паузу. Не действуй. Собирай внимание.", group: 3 },
        { id: 12, name: "ᛃ Йера", energy: "Озарение, эврика, результат как награда", where: "Вспышка. 'Точно!'. Решение пришло само.", what: "Запиши озарение. Оно не повторится.", group: 3 },
        { id: 13, name: "ᛈ Перт", energy: "Второй шанс, новая игра на старом поле", where: "Ты не начинаешь с нуля. Ты используешь старый опыт для нового результата.", what: "Не беги за новым. Посмотри на старое свежим взглядом.", group: 4 },
        { id: 14, name: "ᛇ Эйваз", energy: "Действие на основе опыта, мост", where: "Ты чинишь старую машину новым способом. Не покупаешь новую.", what: "Используй то, что уже есть. Не добывай новое.", group: 4 },
        { id: 15, name: "ᛉ Альгиз", energy: "Защита, интуиция, антенна", where: "Ты чувствуешь опасность заранее. Внутренний голос говорит 'стой'.", what: "Доверься. Проверь ещё раз. Это не паранойя, а осознанность.", group: 4 },
        { id: 16, name: "ᛋ Соулу", energy: "Победа, целостность, опыт как форма", where: "Ты прошёл цикл. Ты стал другим. Опыт остался с тобой.", what: "Зафиксируй: чему ты научился. Это твоё солнце.", group: 4 },
        { id: 17, name: "ᛏ Тейваз", energy: "Концентрация воли, начало конца", where: "Ты бросаешь копьё в цель. Вкладываешь весь накопленный опыт в одно движение.", what: "Действуй без сомнений. Но только если есть Соулу за спиной.", group: 5 },
        { id: 18, name: "ᛒ Беркана", energy: "Возрождение, рост, взращивание", where: "Из действия вырастает новое. Беременность, запуск продукта, ежедневная забота.", what: "Не торопись. Рост требует времени. Не бросай новорождённое.", group: 5 },
        { id: 19, name: "ᛖ Эваз", energy: "Перемещение, обмен, партнёрство", where: "Ты обмениваешь старое на новое. Продаёшь машину, синхронизируешься с миром.", what: "Найди пару. В одиночку Эваз не работает.", group: 5 },
        { id: 20, name: "ᛗ Маназ", energy: "Человек разумный, интеграция, социум", where: "Ты смотришь в зеркало и узнаёшь себя — но другого. Общество приняло твою новую роль.", what: "Прими себя нового. Позволь миру подтвердить.", group: 5 },
        { id: 21, name: "ᛚ Лагуз", energy: "Поток, доверие, подсознание", where: "Ответ приходит во сне. Или случайно. Вода сама находит путь.", what: "Перестань контролировать. Доверься течению. Но не ложись на диван.", group: 6 },
        { id: 22, name: "ᛜ Ингуз", energy: "Семя, потенциал внутри формы", where: "Книга сдана в печать, но ещё не вышла. Результат уже есть, но не проявлен.", what: "Жди. Не раскапывай семя. Дай время.", group: 6 },
        { id: 23, name: "ᛟ Отал", energy: "Наследство, традиция, связь", where: "Ты передаёшь плоды тем, кто придёт после. Бизнес — сыну. Знания — ученику.", what: "Осознай: ты не первый и не последний. Передай дальше.", group: 6 },
        { id: 24, name: "ᛞ Дагаз", energy: "Перерождение, смена дня и ночи", where: "Старое ушло. Новое пришло. Бабочка вышла из кокона.", what: "Открой дверь. Дагаз — не конец. Это начало нового Феху.", group: 6 }
    ];

    function renderRunes(filterGroup = "all") {
        const container = document.getElementById("runeList");
        if (!container) return;
        
        let filtered = runes;
        if (filterGroup !== "all") {
            filtered = runes.filter(r => r.group === parseInt(filterGroup));
        }
        
        let html = "";
        for (let r of filtered) {
            html += `
                <div class="rune-card">
                    <div class="rune-img">
                        <img src="/img/${r.id}.jpg" alt="${r.name}" onerror="this.src='data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2050%2050%22%3E%3Crect%20width%3D%2250%22%20height%3D%2250%22%20fill%3D%22%232b211c%22%2F%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2250%25%22%20text-anchor%3D%22middle%22%20dominant-baseline%3D%22middle%22%20fill%3D%22%23b87c4f%22%20font-size%3D%2220%22%3E${r.name.charAt(2)}%3C%2Ftext%3E%3C%2Fsvg%3E'">
                    </div>
                    <div class="rune-info">
                        <div class="rune-name">${r.name}</div>
                        <div class="rune-energy">${r.energy}</div>
                        <div class="where"><span>📍 Где ты:</span> ${r.where}</div>
                        <div class="what">⚡ Что делать дальше: ${r.what}</div>
                        <div class="rune-num">#${r.id} · ${r.group === 1 ? "Группа 1–4 Зарождение" : r.group === 2 ? "Группа 5–8 Движение" : r.group === 3 ? "Группа 9–12 Трансформация" : r.group === 4 ? "Группа 13–16 Перерождение" : r.group === 5 ? "Группа 17–20 Завершение" : "Группа 21–24 Итог"}</div>
                    </div>
                </div>
            `;
        }
        container.innerHTML = html;
    }

    const btns = document.querySelectorAll(".filter-btn");
    btns.forEach(btn => {
        btn.addEventListener("click", () => {
            btns.forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            const group = btn.getAttribute("data-group");
            renderRunes(group);
        });
    });

    renderRunes("all");
</script>
</body>
</html>
